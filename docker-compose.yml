version: "3.9"

services:
  plato:
    build:
      context: .
      dockerfile: Dockerfile
    image: cocapn-plato:latest
    container_name: cocapn-plato
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
